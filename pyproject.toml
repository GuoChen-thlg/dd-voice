[project]
name = "dd-voice"
version = "0.1.0"
description = "Whisper 兼容的某包语音转写服务（OpenAI /v1/audio/transcriptions）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anyio>=4.0",
    "python-multipart>=0.0.9",
    "websocket-client>=1.8",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
dd-voice = "ddvoice.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddvoice"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pyinstaller>=6.0",
]
